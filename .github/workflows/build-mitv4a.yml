name: Build mitv4a Android TV APK

on:
  push:
    branches: [ "mitv4a", "mitv4a-stable" ]
  workflow_dispatch:

jobs:
  build-android-mitv4a:
    name: Build FakeAtv APK for MiTV4A (API 23, unsigned)
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Configure Pre-installed Android NDK
        run: |
          NDK_PATH=$(find "$ANDROID_HOME/ndk" -maxdepth 1 -mindepth 1 | sort -V | tail -n1)
          if [ -z "$NDK_PATH" ] && [ -n "$ANDROID_NDK_ROOT" ]; then
            NDK_PATH="$ANDROID_NDK_ROOT"
          fi
          echo "Found pre-installed NDK: $NDK_PATH"
          echo "ANDROID_NDK_HOME=$NDK_PATH" >> $GITHUB_ENV

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi

      - name: Install cargo-ndk (Prebuilt binary)
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - name: Build Android APK (unsigned, no signing certificate required)
        run: |
          chmod +x ./scripts/*.sh
          chmod +x ./android-tv/gradlew
          ./scripts/build_android.sh release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FakeAtv-mitv4a-APK
          path: android-tv/app/build/outputs/apk/release/*.apk
          retention-days: 30
